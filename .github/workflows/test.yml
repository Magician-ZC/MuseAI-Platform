name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  rust-test:
    name: Rust Tests (桌面轨 src-tauri)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 范围与 platform-test 里那道完全一致（理由见那里的长注释）。
      - name: Clippy (correctness / suspicious / perf)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- \
            -A clippy::all -D clippy::correctness -D clippy::suspicious -D clippy::perf

  # 平台轨（muse-engine + server + admin）。桌面轨的系统依赖（webkit 等）在此不需要，
  # 两个 crate 均为纯 Rust，且各自独立成包——仓库根没有 workspace Cargo.toml。
  platform-test:
    name: Platform Tests (引擎 + 后端 + 后台)
    runs-on: ubuntu-22.04

    # 生产跑 Postgres（`MUSE_DATABASE_URL=postgres://...`），而 server 测试历来只跑
    # `sqlite::memory:`——`db.rs` 头注释那条「双库可移植 SQL 子集」长期零自动化验证。
    # 这个 service 就是把它接上自动化用的，只有显式设了 `MUSE_TEST_DATABASE_URL` 的步骤
    # 会连它；SQLite 那两遍不读该变量，行为与耗时一个字不变。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: muse
          POSTGRES_DB: muse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/muse-engine
            server

      - name: Engine tests
        run: cargo test --manifest-path crates/muse-engine/Cargo.toml

      - name: Server tests (default features)
        run: cargo test --manifest-path server/Cargo.toml

      # billing/arena 默认不进构建（合规阶段门未过），但测试必须跑——
      # 否则 feature-gated 代码会在无人察觉中腐化。
      - name: Server tests (billing + arena)
        run: cargo test --manifest-path server/Cargo.toml --features billing,arena

      # ---- Postgres 兼容性：上面两遍的**增量第二遍**，不替代它们 ----
      #
      # 建池统一走 `server/src/testkit.rs`：`MUSE_TEST_DATABASE_URL` 决定连哪个库，
      # 不设 = `sqlite::memory:`。PG 下每个池独占一个 schema（原子计数器取号，无随机/时间戳），
      # 故并行用例互不污染。
      #
      # ⚠️ 两遍不可同时开跑：取号器是进程内的，同库并行的两个测试进程会撞名。
      # 下面每步各给一个 `MUSE_TEST_SCHEMA_PREFIX`，步骤本身也是串行的。
      # 引号不可省：行尾的 `testkit::` 会被 YAML 当成映射键分隔符，整个 workflow 解析失败。
      - name: Server tests on Postgres (schema 层可移植性)
        run: "cargo test --manifest-path server/Cargo.toml testkit::"
        env:
          MUSE_TEST_DATABASE_URL: postgres://muse:muse@localhost:5432/muse_test
          MUSE_TEST_SCHEMA_PREFIX: muse_schema

      # ✅ **已收口，故阻塞。** 曾经的两条红线均已修完：
      #   ① `?` → `$N`（sqlx 的 `Any` 驱动原样透传 SQL、不做占位符改写，PG 上每条带参
      #      查询都是 42601 语法错）——见 `testkit::tests::
      #      numbered_placeholders_are_portable_but_question_marks_are_not`；
      #   ② `SUM()` 解码（PG 下 `SUM(bigint)` 返回 `numeric`，`Any` 驱动不认这个类型）——
      #      投影出来的 SUM 一律 `CAST(... AS BIGINT)`。
      # 两个 feature 组合各跑一遍：billing/arena 那批（ledger/billing/shop/arena/livegate）
      # 全是金额聚合，正是 ② 的高发区，default 那遍覆盖不到。
      - name: Server tests on Postgres (default features)
        run: cargo test --manifest-path server/Cargo.toml
        env:
          MUSE_TEST_DATABASE_URL: postgres://muse:muse@localhost:5432/muse_test
          MUSE_TEST_SCHEMA_PREFIX: muse_full

      - name: Server tests on Postgres (billing + arena)
        run: cargo test --manifest-path server/Cargo.toml --features billing,arena
        env:
          MUSE_TEST_DATABASE_URL: postgres://muse:muse@localhost:5432/muse_test
          MUSE_TEST_SCHEMA_PREFIX: muse_full_ba


      # ---- Rust 静态检查（本仓库此前**一个都没有**） ----
      #
      # 🔴 **范围是刻意收窄的**：只 deny `correctness` / `suspicious` / `perf` 三类，
      # 其余（style / pedantic / complexity / doc 排版）一律 `-A clippy::all` 关掉。
      #
      # 不是「先松后紧」，是**这三类和其余几类不是一回事**：前者指向「这段代码在某些
      # 输入下会做错事 / 会白花开销」，后者指向「换个写法更好看」。把两者塞进同一道门，
      # 结果必然是几十条排版噪声淹掉一条真问题，然后所有人学会忽略这道门——
      # 那比没有门更糟（一道被无视的门会让人以为已经检查过了）。
      #
      # 首次接入时实际扫出的东西也印证了这个取舍：三个 crate 一共 17 处，
      # 全部落在这三类里（`.expect(&format!(..))` 无条件分配 ×7、`&[x.clone()]` 可换
      # `slice::from_ref` ×3、`contains` ×3、跨 await 持锁 ×7），
      # 而被关掉的那几类有 26 条纯文档排版。
      #
      # ⚠️ 跨 await 持锁那 7 处经审查是**有意的**（测试用的进程级 env 串行化锁，
      # 不跨 await 持有等于没锁），故在 `interventions::tests` 上带理由 `#[allow]`，
      # 而不是改行为——这道门的用法是「要么修，要么写清楚为什么不修」。
      - name: Clippy (correctness / suspicious / perf)
        run: |
          for m in crates/muse-engine/Cargo.toml server/Cargo.toml; do
            cargo clippy --manifest-path "$m" --all-targets -- \
              -A clippy::all -D clippy::correctness -D clippy::suspicious -D clippy::perf
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Admin build (tsc + vite)
        working-directory: admin
        run: |
          npm ci
          npm run build
